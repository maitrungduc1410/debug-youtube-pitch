<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tua nhanh mà không bị giọng chuột: tự làm WSOLA</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #151924;
    --text: #f2f4f8;
    --muted: #8a93a6;
    --accent: #ffd43b;
    --accent-2: #4dabf7;
    --seam: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 560px;
    padding: 24px 18px 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 23px; text-align: center; }
  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .label { color: var(--muted); font-size: 14px; min-width: 64px; }
  button {
    font: inherit;
    font-weight: 700;
    padding: 9px 14px;
    border: 0;
    border-radius: 10px;
    background: #222838;
    color: var(--text);
    cursor: pointer;
  }
  button.active { background: var(--accent); color: #111; }
  button.rec { background: #3b1d22; }
  button.rec.on { background: #ff6b6b; color: #111; }
  #status { color: var(--muted); font-size: 14px; min-height: 21px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #cards { display: flex; flex-direction: column; gap: 12px; }
  .card.playing { outline: 3px solid var(--accent); }
  #card-original {
    position: sticky;
    top: 8px;
    z-index: 1;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .65);
    border: 1px solid #2a3142;
  }
  .card header { display: flex; align-items: center; gap: 12px; }
  .card h2 { margin: 0; font-size: 19px; flex: 1; }
  .card .hz {
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }
  .card .hz small { font-size: 14px; font-weight: 700; }
  .card .hz.live { color: var(--accent); }
  .card .hz.done { color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card .play {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 20px;
    background: var(--accent-2);
    color: #08111c;
    flex: none;
  }
  canvas { width: 100%; height: 92px; display: block; border-radius: 10px; background: #0e1119; }
  .legend { font-size: 12px; color: var(--muted); }
  .legend b { color: var(--seam); }
  footer { color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--accent-2); }
</style>
</head>
<body>
<main>
  <h1>Tua 2x mà không bị giọng chuột?<br>Thử 3 cách cắt ghép âm thanh</h1>

  <section class="panel">
    <div class="row">
      <span class="label">Nguồn</span>
      <button id="srcSynth" class="active">Giọng tổng hợp</button>
      <button id="srcFile">Chọn file…</button>
      <button id="srcRec" class="rec">● Thu 5 giây</button>
      <input type="file" id="file" accept="audio/*,video/*" hidden>
    </div>
    <div class="row" id="rates">
      <span class="label">Tốc độ</span>
      <button data-rate="1.5">1.5x</button>
      <button data-rate="2" class="active">2x</button>
      <button data-rate="3">3x</button>
      <button data-rate="4">4x</button>
    </div>
    <div id="status">Đang chuẩn bị…</div>
  </section>

  <div id="cards"></div>

  <footer>
    WSOLA dùng đúng thông số của Chromium: mảnh 20 ms, dò trước sau ±15 ms (tổng 30 ms)
    (<a href="https://github.com/chromium/chromium/blob/main/media/filters/audio_renderer_algorithm.cc" target="_blank">audio_renderer_algorithm.cc</a>)
  </footer>
</main>

<script>
const MODES = [
  {
    id: 'original',
    title: 'Gốc (1x)',
    desc: 'Âm thanh ban đầu, chưa tua.',
  },
  {
    id: 'resample',
    title: 'Phát nhanh cả đoạn',
    desc: 'Như cho băng cát-xét chạy nhanh hơn: sóng bị nén lại nên giọng cao lên, ra giọng chuột.',
  },
  {
    id: 'chop',
    title: '① Cắt thẳng rồi nối',
    desc: 'Phát một mảnh 10 ms, bỏ qua một đoạn, rồi nối các mảnh sát nhau. Giữ được cao độ nhưng chỗ nối bị gãy, nghe lụp bụp.',
  },
  {
    id: 'ola',
    title: '② Ghép chồng (OLA)',
    desc: 'Mảnh 20 ms làm mờ hai đầu rồi chồng lên nhau. Hết lụp bụp, nhưng hai mảnh lệch nhịp nên nghe rè, hơi méo.',
  },
  {
    id: 'wsola',
    title: '③ WSOLA (cách của Chrome)',
    desc: 'Như ②, nhưng trước khi nối, mỗi mảnh được dò xê dịch trước sau ±15 ms để tìm đoạn khớp nhất với mảnh vừa phát rồi mới ghép.',
  },
  {
    id: 'browser',
    title: 'Trình duyệt tự làm',
    desc: 'Thẻ <audio> với playbackRate. Trên Chrome, đây chính là WSOLA viết bằng C++.',
  },
];

const WINDOW_MS = 20;
const SEARCH_MS = 30;
const ZOOM_MS = 60;

const statusEl = document.getElementById('status');
const cardsEl = document.getElementById('cards');
let ctx;
let input = null;
let sampleRate = 48000;
let rate = 2;
let outputs = {};
let current = null;
const browserAudio = new Audio();
let analyser, timeData, browserNode;

function setStatus(t) { statusEl.textContent = t; }

function getCtx() {
  if (!ctx) ctx = new AudioContext();
  return ctx;
}

function getAnalyser() {
  if (!analyser) {
    analyser = getCtx().createAnalyser();
    analyser.fftSize = 4096;
    analyser.connect(ctx.destination);
    timeData = new Float32Array(analyser.fftSize);
  }
  return analyser;
}

// Fundamental frequency by normalized autocorrelation. Spectral peaks are
// unreliable for voice because a harmonic is often louder than the fundamental.
function estimateF0(buf, sr) {
  let energy = 0;
  for (let i = 0; i < buf.length; i++) energy += buf[i] * buf[i];
  if (Math.sqrt(energy / buf.length) < 0.02) return null;
  const minLag = Math.floor(sr / 900), maxLag = Math.ceil(sr / 70);
  const n = buf.length - maxLag;
  const corr = new Float32Array(maxLag + 2);
  for (let lag = minLag; lag <= maxLag + 1; lag++) {
    let s = 0, e1 = 0, e2 = 0;
    for (let i = 0; i < n; i++) {
      s += buf[i] * buf[i + lag];
      e1 += buf[i] * buf[i];
      e2 += buf[i + lag] * buf[i + lag];
    }
    corr[lag] = s / Math.sqrt(e1 * e2 + 1e-12);
  }
  let best = minLag;
  for (let lag = minLag + 1; lag <= maxLag; lag++) if (corr[lag] > corr[best]) best = lag;
  if (corr[best] < 0.5) return null;
  // Prefer the shortest period: the peak at 2x the period is the octave below.
  for (let div = 4; div >= 2; div--) {
    const lag = Math.round(best / div);
    if (lag < minLag) continue;
    let local = lag;
    for (let l = Math.max(minLag + 1, lag - 3); l <= Math.min(maxLag, lag + 3); l++) {
      if (corr[l] > corr[local]) local = l;
    }
    if (corr[local] > 0.9 * corr[best]) { best = local; break; }
  }
  const a = corr[best - 1], b = corr[best], c = corr[best + 1];
  const offset = 0.5 * (a - c) / (a - 2 * b + c || 1);
  return sr / (best + offset);
}

function median(values) {
  const s = [...values].sort((x, y) => x - y);
  return s[Math.floor(s.length / 2)];
}

function showHz(id, hz, cls) {
  const el = document.querySelector(`#card-${id} .hz`);
  el.className = `hz ${cls}`;
  el.innerHTML = hz ? `<small>Max: </small>${Math.round(hz)}<small> Hz</small>` : '—';
}

function measure() {
  if (!current) return;
  analyser.getFloatTimeDomainData(timeData);
  const f0 = estimateF0(timeData, ctx.sampleRate);
  if (!f0) return;
  current.readings.push(f0);
  if (current.readings.length < 3) return;
  // Median of the last 3 readings, so a single octave error cannot become the max.
  const steady = median(current.readings.slice(-3));
  current.max = Math.max(current.max ?? 0, steady);
  showHz(current.id, current.max, 'live');
}

function hann(n) {
  const w = new Float32Array(n);
  for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / n);
  return w;
}

function frameParams(sr) {
  let n = Math.round((sr * WINDOW_MS) / 1000);
  n += n & 1;
  return { n, hop: n / 2, search: Math.round((sr * SEARCH_MS) / 1000 / 2) };
}

function resample(x, r) {
  const out = new Float32Array(Math.floor(x.length / r));
  for (let i = 0; i < out.length; i++) {
    const p = i * r, i0 = Math.floor(p), f = p - i0;
    out[i] = x[i0] * (1 - f) + (x[i0 + 1] ?? 0) * f;
  }
  return out;
}

function chop(x, r, sr) {
  const { hop } = frameParams(sr);
  const out = new Float32Array(Math.floor(x.length / r));
  for (let o = 0; o < out.length; o += hop) {
    const src = Math.round(o * r);
    for (let i = 0; i < hop && o + i < out.length; i++) out[o + i] = x[src + i] ?? 0;
  }
  return out;
}

function bestOffset(x, template, nominal, search, n) {
  const lo = Math.max(0, nominal - search);
  const hi = Math.min(x.length - n - 1, nominal + search);
  const score = (c, step) => {
    let dot = 0, energy = 1e-9;
    for (let i = 0; i < n; i += step) {
      const v = x[c + i];
      dot += x[template + i] * v;
      energy += v * v;
    }
    return dot / Math.sqrt(energy);
  };
  let best = nominal, bestScore = -Infinity;
  for (let c = lo; c <= hi; c += 4) {
    const s = score(c, 2);
    if (s > bestScore) { bestScore = s; best = c; }
  }
  const coarse = best;
  for (let c = Math.max(lo, coarse - 4); c <= Math.min(hi, coarse + 4); c++) {
    const s = score(c, 1);
    if (s > bestScore) { bestScore = s; best = c; }
  }
  return best;
}

function overlapAdd(x, r, sr, withSearch) {
  const { n, hop, search } = frameParams(sr);
  const win = hann(n);
  const outLen = Math.floor(x.length / r);
  const out = new Float32Array(outLen + n);
  let prev = -1;
  for (let o = 0; ; o += hop) {
    const nominal = Math.round(o * r);
    if (nominal + n + search >= x.length || o >= outLen) break;
    let pos = nominal;
    if (withSearch && prev >= 0 && prev + hop + n < x.length) {
      // The natural continuation of the previous frame is what the next
      // frame should look like for the overlap to line up in phase.
      pos = bestOffset(x, prev + hop, nominal, search, n);
    }
    for (let i = 0; i < n; i++) out[o + i] += win[i] * x[pos + i];
    prev = pos;
  }
  return out.subarray(0, outLen);
}

function makeSyntheticVoice(sr, seconds = 6) {
  const out = new Float32Array(Math.round(sr * seconds));
  const vowels = [[730, 1090], [270, 2290], [570, 840], [440, 1020], [530, 1840]];
  const syllablesPerSec = 4;
  const gauss = (f, c, bw) => Math.exp(-(((f - c) / bw) ** 2));
  let phase = 0, peak = 0;
  for (let i = 0; i < out.length; i++) {
    const t = i / sr;
    const f0 = 135 + 35 * Math.sin(2 * Math.PI * 0.35 * t) + 3 * Math.sin(2 * Math.PI * 5.5 * t);
    phase += (2 * Math.PI * f0) / sr;
    const syl = (t * syllablesPerSec) % 1;
    const env = syl < 0.78 ? Math.sin((Math.PI * syl) / 0.78) ** 0.5 : 0;
    const [f1, f2] = vowels[Math.floor(t * syllablesPerSec) % vowels.length];
    let s = 0;
    for (let h = 1; h * f0 < 4000; h++) {
      const fh = h * f0;
      s += (gauss(fh, f1, 110) + 0.7 * gauss(fh, f2, 160) + 0.04) * Math.sin(h * phase);
    }
    out[i] = env * s;
    peak = Math.max(peak, Math.abs(out[i]));
  }
  for (let i = 0; i < out.length; i++) out[i] *= 0.6 / peak;
  return out;
}

function encodeWav(samples, sr) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const dv = new DataView(buf);
  const str = (off, s) => [...s].forEach((c, i) => dv.setUint8(off + i, c.charCodeAt(0)));
  str(0, 'RIFF'); dv.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, samples[i])) * 32767, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function toMono(audioBuffer, maxSeconds = 20) {
  const len = Math.min(audioBuffer.length, Math.round(audioBuffer.sampleRate * maxSeconds));
  const out = new Float32Array(len);
  for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
    const ch = audioBuffer.getChannelData(c);
    for (let i = 0; i < len; i++) out[i] += ch[i] / audioBuffer.numberOfChannels;
  }
  return out;
}

async function loadBlob(blob) {
  const ab = await blob.arrayBuffer();
  const decoded = await getCtx().decodeAudioData(ab);
  sampleRate = decoded.sampleRate;
  input = toMono(decoded);
  render();
}

function render() {
  stop();
  document.querySelectorAll('.card .hz').forEach((el) => { el.className = 'hz'; el.textContent = '—'; });
  setStatus(`Đang xử lý ${(input.length / sampleRate).toFixed(1)} giây âm thanh ở ${rate}x…`);
  setTimeout(() => {
    const t0 = performance.now();
    outputs = {
      original: input,
      resample: resample(input, rate),
      chop: chop(input, rate, sampleRate),
      ola: overlapAdd(input, rate, sampleRate, false),
      wsola: overlapAdd(input, rate, sampleRate, true),
    };
    browserAudio.src = URL.createObjectURL(encodeWav(input, sampleRate));
    setStatus(`Xong trong ${Math.round(performance.now() - t0)} ms. Bấm ▶ để nghe từng cách.`);
    drawAll();
  }, 30);
}

function buildCards() {
  for (const m of MODES) {
    const card = document.createElement('section');
    card.className = 'card';
    card.id = `card-${m.id}`;
    card.innerHTML = `
      <header><h2>${m.title}</h2><div class="hz">—</div><button class="play" aria-label="Phát">▶</button></header>
      <p>${m.desc.replace(/</g, '&lt;')}</p>
      ${m.id === 'browser' ? '' : '<canvas></canvas><div class="legend"></div>'}`;
    card.querySelector('.play').addEventListener('click', () => toggle(m.id));
    cardsEl.append(card);
  }
}

function drawAll() {
  const { hop } = frameParams(sampleRate);
  for (const m of MODES) {
    const canvas = document.querySelector(`#card-${m.id} canvas`);
    if (!canvas) continue;
    const data = outputs[m.id];
    const zoom = Math.round((sampleRate * ZOOM_MS) / 1000);
    const start = loudestWindowStart(data, zoom, hop);
    const seams = ['chop', 'ola', 'wsola'].includes(m.id);
    drawWave(canvas, data, start, zoom, seams ? hop : 0);
    const legend = document.querySelector(`#card-${m.id} .legend`);
    legend.innerHTML = seams
      ? `Phóng to ${ZOOM_MS} ms · <b>vạch đỏ</b> = chỗ nối giữa hai mảnh`
      : `Phóng to ${ZOOM_MS} ms`;
  }
}

function loudestWindowStart(data, zoom, hop) {
  let best = 0, bestE = -1;
  const step = Math.max(hop, 1);
  for (let s = Math.floor(data.length * 0.2); s + zoom < data.length * 0.8; s += step * 8) {
    let e = 0;
    for (let i = 0; i < zoom; i += 16) e += data[s + i] ** 2;
    if (e > bestE) { bestE = e; best = s; }
  }
  return hop ? Math.round(best / hop) * hop : best;
}

function drawWave(canvas, data, start, len, hop) {
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, w, h);
  let peak = 1e-6;
  for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(data[start + i] ?? 0));
  if (hop) {
    g.strokeStyle = 'rgba(255,107,107,.75)';
    g.setLineDash([4 * dpr, 4 * dpr]);
    for (let s = Math.ceil(start / hop) * hop; s < start + len; s += hop) {
      const x = ((s - start) / len) * w;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
    }
    g.setLineDash([]);
  }
  g.strokeStyle = '#ffd43b';
  g.lineWidth = 1.6 * dpr;
  g.beginPath();
  for (let i = 0; i < len; i++) {
    const x = (i / len) * w;
    const y = h / 2 - ((data[start + i] ?? 0) / peak) * (h / 2 - 6 * dpr);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
}

function stop() {
  if (current) {
    clearInterval(current.timer);
    showHz(current.id, current.max ?? null, 'done');
  }
  if (current?.node) { current.node.onended = null; current.node.stop(); }
  browserAudio.pause();
  document.querySelectorAll('.card').forEach((c) => {
    c.classList.remove('playing');
    c.querySelector('.play').textContent = '▶';
  });
  current = null;
}

async function toggle(id) {
  const wasPlaying = current?.id === id;
  stop();
  if (wasPlaying || !input) return;
  const card = document.getElementById(`card-${id}`);
  card.classList.add('playing');
  card.querySelector('.play').textContent = '■';
  const ac = getCtx();
  await ac.resume();
  const an = getAnalyser();
  showHz(id, null, 'live');
  if (id === 'browser') {
    if (!browserNode) {
      // Tapped after the browser's own time-stretching, so this measures Chrome's WSOLA.
      browserNode = ac.createMediaElementSource(browserAudio);
      browserNode.connect(an);
    }
    browserAudio.currentTime = 0;
    browserAudio.preservesPitch = true;
    browserAudio.playbackRate = rate;
    browserAudio.onended = stop;
    await browserAudio.play();
    current = { id, readings: [] };
  } else {
    const data = outputs[id];
    const buf = ac.createBuffer(1, data.length, sampleRate);
    buf.copyToChannel(data, 0);
    const node = ac.createBufferSource();
    node.buffer = buf;
    node.connect(an);
    node.onended = stop;
    node.start();
    current = { id, node, readings: [] };
  }
  current.timer = setInterval(measure, 100);
}

document.getElementById('rates').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  rate = Number(btn.dataset.rate);
  document.querySelectorAll('#rates button').forEach((b) => b.classList.toggle('active', b === btn));
  if (input) render();
});

const srcButtons = ['srcSynth', 'srcFile', 'srcRec'].map((id) => document.getElementById(id));
function markSource(btn) { srcButtons.forEach((b) => b.classList.toggle('active', b === btn)); }

document.getElementById('srcSynth').addEventListener('click', (e) => {
  markSource(e.currentTarget);
  sampleRate = 48000;
  input = makeSyntheticVoice(sampleRate);
  render();
});

const fileEl = document.getElementById('file');
document.getElementById('srcFile').addEventListener('click', () => fileEl.click());
fileEl.addEventListener('change', async () => {
  const f = fileEl.files[0];
  if (!f) return;
  markSource(document.getElementById('srcFile'));
  setStatus(`Đang đọc ${f.name}…`);
  try {
    await loadBlob(f);
  } catch (err) {
    setStatus(`Không đọc được file: ${err.message}`);
  }
});

document.getElementById('srcRec').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  if (btn.classList.contains('on')) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus(`Không mở được micro: ${err.message}`);
    return;
  }
  stop();
  markSource(btn);
  btn.classList.add('on');
  const rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = (ev) => chunks.push(ev.data);
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    btn.classList.remove('on');
    btn.textContent = '● Thu 5 giây';
    await loadBlob(new Blob(chunks, { type: rec.mimeType }));
  };
  rec.start();
  for (let s = 5; s > 0; s--) {
    btn.textContent = `● Đang thu… ${s}`;
    setStatus('Nói gì đó vào micro nhé');
    await new Promise((r) => setTimeout(r, 1000));
  }
  rec.stop();
});

buildCards();
input = makeSyntheticVoice(sampleRate);
render();
</script>
</body>
</html>
